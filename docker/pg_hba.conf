# PostgreSQL Client Authentication Configuration
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Local connections (inside container)
local   all             all                                     trust

# IPv4 local connections (localhost)
host    all             all             127.0.0.1/32            scram-sha-256

# IPv6 local connections
host    all             all             ::1/128                 scram-sha-256

# Allow connections from Docker network
host    all             all             172.16.0.0/12           scram-sha-256

# Allow connections from common private networks (Power BI on Windows)
# 192.168.x.x range (most home/office networks)
host    all             all             192.168.0.0/16          scram-sha-256

# 10.x.x.x range (some corporate networks)
host    all             all             10.0.0.0/8              scram-sha-256

# If you need to allow ALL connections (less secure, use only for testing):
# host    all             all             0.0.0.0/0               scram-sha-256
